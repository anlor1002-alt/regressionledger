name: Render demo GIF

# Renders demo/regressionledger.tape with VHS on a runner (no local TTY needed)
# and commits the resulting GIF back to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo/regressionledger.tape"
      - "demo/simulate.js"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg, ttyd, and VHS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          curl -fsSL https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64 -o /tmp/ttyd
          sudo install /tmp/ttyd /usr/local/bin/ttyd
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update -q
          sudo apt-get install -y -q vhs
      - name: Render the tape
        run: vhs demo/regressionledger.tape
      - name: Commit the GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/regressionledger.gif
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: render demo GIF via VHS [skip ci]"
          git pull --rebase origin main
          git push
